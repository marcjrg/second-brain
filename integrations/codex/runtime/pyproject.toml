[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-codex-watchdog"
version = "0.1.0"
description = "Opt-in independent Level 2 Codex app-server watchdog"
requires-python = ">=3.11"

[project.scripts]
second-brain-watchdog = "watchdog.runtime:main"

[tool.setuptools]
packages = ["watchdog"]
